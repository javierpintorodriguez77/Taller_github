<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cara Feliz Grande</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }

    .cara {
      width: 300px;
      height: 300px;
      background-color: #FFD700;
      border-radius: 50%;
      border: 8px solid #000;
      position: relative;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .ojo {
      width: 35px;
      height: 55px;
      background-color: #000;
      border-radius: 50%;
      position: absolute;
      top: 75px;
    }

    .ojo.izquierdo {
      left: 75px;
    }

    .ojo.derecho {
      right: 75px;
    }

    .boca {
      width: 160px;
      height: 80px;
      border-bottom: 12px solid #000;
      border-radius: 0 0 100px 100px;
      position: absolute;
      bottom: 55px;
      left: 50%;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>

  <div class="cara">
    <div class="ojo izquierdo"></div>
    <div class="ojo derecho"></div>
    <div class="boca"></div>
  </div>

</body>
</html>
